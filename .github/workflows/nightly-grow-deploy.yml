# Grocery Hauls za Pro — nightly catalog grow + auto deploy
# Runs every day at 00:00 South Africa time (22:00 UTC)

name: Nightly grow + deploy

on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC = 00:00 SAST (midnight, South Africa)
  workflow_dispatch: # the manual "Run workflow" button for testing

permissions:
  contents: write # lets the job commit the grown catalog back

concurrency:
  group: nightly-grow-deploy
  cancel-in-progress: false

jobs:
  grow-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Bun (catalog tools)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Grow catalog (+15 products, skips if queue is empty)
        run: bun scripts/grow-catalog.mjs --limit 15

      - name: Stamp today's build date
        run: |
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s/^build:.*/build: ${DATE} (auto)/" public/version.txt
          cat public/version.txt

      - name: Build static site
        run: node scripts/build-static.mjs
        env:
          NEXT_PUBLIC_STATIC: '1'

      - name: Commit grown catalog back to repo
        run: |
          git config user.name "grocery-grow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/custom.db scripts/catalog-seed.json public/data public/version.txt
          if git diff --cached --quiet; then
            echo "Nothing grew tonight (queue empty) — skipping commit"
          else
            git commit -m "nightly catalog grow [skip ci]"
            git push
          fi

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy out --project-name="${{ secrets.CLOUDFLARE_PROJECT_NAME }}" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
